[build-system]
requires = [
    "cmeel[build] >=0.56",
    "roboplan-core ==0.6.1",
    "roboplan-hardware-interface ==0.6.1",
]
build-backend = "cmeel.build"

[project]
name = "roboplan-mujoco"
version = "0.6.1"
description = "MuJoCo simulation interface for RoboPlan."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.15"
authors = [{ name = "Muhammad Ahmed", email = "thisisdeahmed@gmail.com" }]
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = [
    "numpy",
    "pycollada >=0.9.2,<0.10",
    "roboplan-core ==0.6.1",
    "roboplan-hardware-interface ==0.6.1",
    "trimesh >=4.12.2,<5",
    "xacro >=2.1.1,<3",
]

[project.urls]
Homepage = "https://github.com/open-planning/roboplan"

[tool.pixi.package]
publish = true

[tool.pixi.package.build]
backend = { name = "pixi-build-cmake", version = "*" }

[tool.pixi.package.host-dependencies]
glfw = ">=3.4,<4"
libmujoco = "==3.12.0"
roboplan-core = { path = "../roboplan_core" }
roboplan-hardware-interface = { path = "../roboplan_hardware_interface" }
tinyxml2 = ">=11,<12"

[tool.pixi.package.run-dependencies]
numpy = { workspace = true }
pycollada = ">=0.9.2,<0.10"
python = { workspace = true }
trimesh = ">=4.12.2,<5"
xacro = ">=2.1.1,<3"

[tool.pixi.package.run-exports.weak]
roboplan-mujoco = { pin-subpackage = true }

[tool.cmeel]
run-tests = false
