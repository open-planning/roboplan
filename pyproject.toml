[build-system]
requires = [
    "cmeel[build] >=0.56",
    "cmeel-eigen[build]",
    "cmeel-yaml-cpp[build] >=0.8, <0.9",
    "libpinocchio[build] == 4.1.0",
    "libproxsuite[build] == 0.7.3",
    "nanobind >=1.3.2",
]
build-backend = "cmeel.build"

[project]
name = "roboplan"
version = "0.6.1"
description = "Modern robot motion planning library based on Pinocchio."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
authors = [
    { name = "Sebastian Castro", email = "sebas.a.castro@gmail.com" },
    { name = "Erik Holum", email = "eholum@gmail.com" },
    { name = "Sebastian Jahr", email = "sebastian.jahr@tuta.io" },
    { name = "Jafar Uruç", email = "jafar.uruc@gmail.com" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "cmeel-yaml-cpp >=0.8, <0.9; platform_system != 'Windows'",
    "matplotlib",
    "numpy",
    "pin >=4.1.0, <4.2",
]

[project.urls]
Homepage = "https://github.com/open-planning/roboplan"

[tool.cmeel]
source = "superbuild"
run-tests = false
configure-args = [
    "-DROBOPLAN_BUILD_EXAMPLES=OFF",
    "-DBUILD_PYTHON_BINDINGS=ON",
    "-DGENERATE_PYTHON_STUBS=OFF",
    "-DCMAKE_POLICY_VERSION_MINIMUM=3.22",
    "-DCMAKE_CXX_STANDARD=17",
    "-DCMAKE_CXX_STANDARD_REQUIRED=ON",
    "-DCMAKE_INSTALL_RPATH_USE_LINK_PATH=FALSE",
]


[tool.pixi.workspace]
channels  = ["conda-forge"]
preview = ["pixi-build"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "win-64"]

[tool.pixi.activation.env]
CMAKE_INSTALL_PREFIX = "$CONDA_PREFIX"
LD_LIBRARY_PATH      = "$CONDA_PREFIX/lib"
ASAN_OPTIONS         = "symbolize=1:print_stacktrace=1"
ASAN_SYMBOLIZER_PATH = "$CONDA_PREFIX/bin/llvm-symbolizer"
ROBOPLAN_C_COMPILER  = "clang"
ROBOPLAN_CXX_COMPILER = "clang++"
ROBOPLAN_LINKER_FLAG = " "
ROBOPLAN_EXTRA_CMAKE_ARGS = " "

[tool.pixi.target.linux.activation.env]
ROBOPLAN_LINKER_FLAG = "-fuse-ld=mold"

[tool.pixi.feature.local.activation.env]
CMAKE_INSTALL_MODE   = "SYMLINK"
CMAKE_BUILD_TYPE     = "RelWithDebInfo"

[tool.pixi.feature.ci.activation.env]
CMAKE_INSTALL_MODE   = "COPY"
CMAKE_BUILD_TYPE     = "Debug"

# Debug builds on Windows link the debug MSVC runtime, which is ABI
# incompatible with the release runtime used by the conda-forge binaries.
[tool.pixi.feature.ci.target.win.activation.env]
CMAKE_BUILD_TYPE = "RelWithDebInfo"

# Windows activation scripts expand %VAR% instead of $VAR.
[tool.pixi.target.win.activation.env]
CMAKE_INSTALL_PREFIX = "%CONDA_PREFIX%"
# Use the MSVC-compatible clang driver: conda-forge packages are built with
# MSVC and export MSVC-style flags that the GNU-style clang++ driver rejects.
ROBOPLAN_C_COMPILER  = "clang-cl"
ROBOPLAN_CXX_COMPILER = "clang-cl"
ROBOPLAN_LINKER_FLAG = " "
ROBOPLAN_EXTRA_CMAKE_ARGS = "-DCMAKE_LINKER=lld-link"
# The Windows Clang toolchain activates the MSVC build environment, which
# selects platform and toolset values for Visual Studio generators. Ninja
# accepts neither setting.
CMAKE_GENERATOR_PLATFORM = ""
CMAKE_GENERATOR_TOOLSET = ""

# Symlink creation in Windows requires developer mode or admin privileges.
[tool.pixi.feature.local.target.win.activation.env]
CMAKE_INSTALL_MODE = "COPY"

[tool.pixi.tasks]
# Configures the whole superbuild in one shared build tree, using the
# 'pixi' preset (superbuild/CMakePresets.json) for compiler/linker/build-cache
# settings. cxx_flags/extra_flags are for one-off variant builds (see
# build_asan/build_timetrace below); leave default for a normal configure.
configure = { cmd = "cmake -S superbuild --preset pixi {{ '-DCMAKE_CXX_FLAGS=' + cxx_flags if cxx_flags }} {{ '-DCMAKE_C_FLAGS=' + cxx_flags if cxx_flags }} {{ extra_flags }} $ROBOPLAN_EXTRA_CMAKE_ARGS", args = [
  { arg = "cxx_flags", default = "" },
  { arg = "extra_flags", default = "" },
] }

# Builds everything by default. Pass a package name to build just that
# package (library, tests, bindings) and its deps, e.g. `pixi run build
# roboplan_rrt` -- maps to Ninja's per-directory `<dir>/all` target.
build = { cmd = "cmake --build build {{ '--target ' + package_name + '/all' if package_name }}", depends-on = [
  { task = "configure", args = [
    "{{ cxx_flags }}",
    "{{ extra_flags }}",
  ] },
], args = [
  { arg = "package_name", default = "" },
  { arg = "cxx_flags", default = "" },
  { arg = "extra_flags", default = "" },
] }

# Installs every package into $CONDA_PREFIX. Always installs everything --
# one shared install tree, no meaningful "install just one package".
install = { cmd = "cmake --install build", depends-on = [
  { task = "build", args = [
    "",
    "{{ cxx_flags }}",
    "{{ extra_flags }}",
  ] },
], args = [
  { arg = "cxx_flags", default = "" },
  { arg = "extra_flags", default = "" },
] }

build_asan = { cmd = "cmake --build build {{ '--target ' + package_name + '/all' if package_name }}", depends-on = [
  { task = "configure", args = [
    "-fsanitize=address",
    "-DGENERATE_PYTHON_STUBS=OFF",
  ] },
], args = [
  { arg = "package_name", default = "" },
] }
# https://clang.llvm.org/docs/analyzer/developer-docs/PerformanceInvestigation.html#performance-analysis-using-ftime-trace
build_timetrace = { cmd = "cmake --build build {{ '--target ' + package_name + '/all' if package_name }}", depends-on = [
  { task = "configure", args = [
    "-ftime-trace",
    "",
  ] },
], args = [
  { arg = "package_name", default = "" },
] }

# Pass a package name to run just that package's tests, e.g.
# `pixi run test roboplan_rrt` -- scopes --test-dir to its build subdir.
test = { cmd = "ctest -V --test-dir build{{ '/' + package_name if package_name }}", args = [
  { arg = "package_name", default = "" },
], env = { GTEST_COLOR = "YES" } }

test_py  = { cmd = "python -m pytest --capture=no */bindings/test roboplan_examples/test" }
test_all = { depends-on = ["test_py", "test"] }
test_benchmarks = { cmd = "python -m pytest benchmarks/ --benchmark-json pytest_benchmarks.json" }

# Clang-tidy against the superbuild's single compile_commands.json. Pass a
# package name to scope to just that package's sources.
clang-tidy = { cmd = "run-clang-tidy -p build -quiet \"^$PIXI_PROJECT_ROOT/{{ package_name + '/' if package_name }}[^.]\"", args = [
  { arg = "package_name", default = "" },
] }

clang-tidy-fix = { cmd = "run-clang-tidy -p build -fix -quiet \"^$PIXI_PROJECT_ROOT/{{ package_name + '/' if package_name }}[^.]\"", args = [
  { arg = "package_name", default = "" },
] }

[tool.pixi.dependencies]
# Root CMake workflow, linting, tests, benchmarks, and sanitizer tasks.
clang-tools      = ">=19.1.7,<20"
cmake            = ">=3.30.5,<4"
ninja            = ">=1.12.1,<2"
clangxx          = ">=19.1.7,<20"
lld              = ">=19.1.2,<20"
sccache          = ">=0.16.0,<0.17"
gtest            = ">=1.17.0,<2"
llvm-tools       = ">=19.1.7,<20"
compiler-rt      = ">=19.1.7,<20"
pytest           = ">=6"
pytest-benchmark = ">=5.1.0,<6"

[tool.pixi.target.linux.dependencies]
gxx         = ">=11,<12"
gcc         = ">=11,<12"
libstdcxx   = ">=15.1.0,<16"
mold        = ">=2.40.2,<3"

[tool.pixi.target.win.dependencies]
# The MSVC STL on current GitHub Windows runners (Visual Studio 2026) requires
# clang >= 20, so use a newer LLVM toolchain than on the Unix platforms.
clang-tools = ">=22.1.8,<23"
clangxx     = ">=22.1.8,<23"
compiler-rt = ">=22.1.8,<23"
lld         = ">=22.1.8,<23"
llvm-tools  = ">=22.1.8,<23"

# Packages actively developed in this workspace. This installs their dependencies but leaves building them up to the user.
[tool.pixi.dev]
roboplan-common = { path = "roboplan_common" }
roboplan-core = { path = "roboplan" }
roboplan-example-models = { path = "roboplan_example_models" }
roboplan-oink = { path = "roboplan_oink" }
roboplan-rrt = { path = "roboplan_rrt" }
roboplan-simple-ik = { path = "roboplan_simple_ik" }
roboplan-toppra = { path = "roboplan_toppra" }
roboplan-cartesian-planning = { path = "roboplan_cartesian_planning" }
roboplan-examples = { path = "roboplan_examples" }


[tool.pixi.feature.lint.dependencies]
pre-commit = ">=4.1.0,<5"

[tool.pixi.feature.lint.tasks]
lint = "pre-commit run --all-files"

[tool.pixi.environments]
default = { features = ["local"] }
ci = { features = ["ci"] }
lint = { features = ["lint"], no-default-feature = true }
