[build-system]
requires = ["scikit-build-core >=0.10", "nanobind >=1.3.2", "roboplan-core"]
build-backend = "scikit_build_core.build"

[project]
name = "roboplan-aligator"
version = "0.5.1"
description = "Trajectory optimization (aligator proximal-DDP) satellite for RoboPlan."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Sebastian Jahr", email = "sebastian.jahr@tuta.io" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
]
dependencies = ["roboplan-core"]

[project.urls]
Homepage = "https://github.com/sea-bass/roboplan"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
cmake.define.BUILD_PYTHON_BINDINGS = "ON"
cmake.define.BUILD_TESTING = "OFF"
# PEP 420 namespace package: no top-level roboplan/__init__.py is shipped.
