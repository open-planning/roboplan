[build-system]
requires = ["cmeel[build] >=0.56", "nanobind >=1.3.2", "roboplan-core ==0.6.1"]
build-backend = "cmeel.build"

[project]
name = "roboplan-simple-ik"
version = "0.6.1"
description = "Simple inverse kinematics solver for RoboPlan."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.15"
authors = [{ name = "Sebastian Castro", email = "sebas.a.castro@gmail.com" }]
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = ["roboplan-common ==0.6.1", "roboplan-core ==0.6.1"]

[project.urls]
Homepage = "https://github.com/open-planning/roboplan"

[tool.cmeel]
run-tests = false
configure-args = ["-DBUILD_PYTHON_BINDINGS=ON", "-DGENERATE_PYTHON_STUBS=OFF"]
