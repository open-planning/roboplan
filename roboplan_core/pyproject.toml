[build-system]
requires = [
    "cmeel[build] >=0.56",
    "cmeel-eigen[build]",
    "cmeel-yaml-cpp[build] >=0.8, <0.9",
    "libpinocchio[build] ==4.1.0",
    "nanobind >=1.3.2",
]
build-backend = "cmeel.build"

[project]
name = "roboplan-core"
version = "0.6.1"
description = "Core types, scene representation, and utilities for RoboPlan."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.15"
authors = [{ name = "Sebastian Castro", email = "sebas.a.castro@gmail.com" }]
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = [
    "cmeel-yaml-cpp >=0.8, <0.9; platform_system != 'Windows'",
    "pin >=4.1.0, <4.2",
    "roboplan-common ==0.6.1",
]

[project.urls]
Homepage = "https://github.com/open-planning/roboplan"

[tool.cmeel]
run-tests = false
configure-args = ["-DBUILD_PYTHON_BINDINGS=ON", "-DGENERATE_PYTHON_STUBS=OFF"]
