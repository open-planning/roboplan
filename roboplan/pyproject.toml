[build-system]
requires = [
    "cmeel[build] >=0.56",
    "cmeel-eigen[build]",
    "cmeel-yaml-cpp[build] >=0.8, <0.9",
    "libpinocchio[build] == 4.1.0",
    "nanobind >=1.3.2",
    "roboplan-common",
]
build-backend = "cmeel.build"

[project]
name = "roboplan-core"
version = "0.6.1"
description = "Core types, scene representation, and utilities for RoboPlan."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Sebastian Castro", email = "sebas.a.castro@gmail.com" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "cmeel-yaml-cpp >=0.8, <0.9; platform_system != 'Windows'",
    "matplotlib",
    "numpy",
    "pin >=4.1.0, <4.2",
    "roboplan-common",
]

[project.urls]
Homepage = "https://github.com/open-planning/roboplan"

[tool.cmeel]
source = "."
run-tests = false
configure-args = [
    "-DBUILD_PYTHON_BINDINGS=ON",
    "-DBUILD_TESTING=OFF",
    "-DGENERATE_PYTHON_STUBS=OFF",
]

[tool.pixi.package]
publish = true

[tool.pixi.package.build]
backend = { name = "pixi-build-cmake", version = "*" }

[tool.pixi.package.build.config]
compilers = ["cxx"]

extra-args = [
    "-DBUILD_PYTHON_BINDINGS=ON",
    "-DBUILD_TESTING=OFF",
    "-DGENERATE_PYTHON_STUBS=OFF",
]

[tool.pixi.package.host-dependencies]
cmake = ">=3.22"
eigen = ">=3.4"
nanobind = ">=2.8"
ninja = "*"
pinocchio = ">=4.1,<5"
python = ">=3.10,<3.15"
roboplan-common = { path = "../roboplan_common" }
console_bridge = "*"
yaml-cpp = ">=0.8"

[tool.pixi.package.run-dependencies]
console_bridge = "*"
matplotlib = "*"
numpy = "*"
pinocchio = ">=4.1,<5"
roboplan-common = { path = "../roboplan_common" }
yaml-cpp = ">=0.8"
