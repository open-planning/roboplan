name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_pypi_wheels:
    name: Build PyPI wheels
    uses: ./.github/workflows/build-pypi-wheels.yml

  publish_pypi:
    name: Publish ${{ matrix.package }} to PyPI
    runs-on: ubuntu-latest
    needs: build_pypi_wheels
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      # One package failing to publish (e.g. a missing trusted publisher) must
      # not cancel the others, so the failed job can be re-run on its own.
      fail-fast: false
      matrix:
        package:
          - roboplan
          - roboplan-common
          - roboplan-core
          - roboplan-example-models
          - roboplan-oink
          - roboplan-rrt
          - roboplan-simple-ik
          - roboplan-toppra
          - roboplan-cartesian-planning
    # Each package publishes from its own environment so that PyPI's trusted
    # publisher configuration is unique per project.
    environment:
      name: pypi-${{ matrix.package }}
      url: https://pypi.org/project/${{ matrix.package }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download distributions
        uses: actions/download-artifact@v5
        with:
          pattern: python-distributions-*
          merge-multiple: true
          path: dist
      - name: Select distributions for ${{ matrix.package }}
        run: |
          python -m pip install --upgrade packaging
          python scripts/select_distributions.py ${{ matrix.package }} --src dist --dst package
      - name: Check distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check package/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: package/
          skip-existing: true
