name: Run Benchmarks

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  benchmarks:
    name: Benchmark
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      contents: write # gh-pages push (main only; see auto-push below)
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ubuntu-24.04-benchmarks-sccache-${{ github.head_ref || github.ref_name }}
          restore-keys: |
            ubuntu-24.04-benchmarks-sccache-main
            ubuntu-24.04-benchmarks-sccache
      - uses: prefix-dev/setup-pixi@v0.8.14
        with:
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          frozen: true
          manifest-path: pyproject.toml
      - name: Build
        run: pixi run -e default install
      - name: Run benchmarks
        # Create a task set to limit benchmarks to two cores max
        run: taskset -c 0-1 pixi run -e default test_benchmarks
      - name: Track benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: pytest
          output-file-path: pytest_benchmarks.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          alert-threshold: "115%"
          comment-on-alert: true
          fail-on-alert: true
