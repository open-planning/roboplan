name: Build PyPI wheels

on:
  workflow_dispatch:
  workflow_call: {}

permissions:
  contents: read

jobs:
  check_version:
    name: Check package versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false
      - name: Read and validate package metadata
        id: package
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path

          packages = [
              "roboplan",
              "roboplan_common",
              "roboplan_core",
              "roboplan_example_models",
              "roboplan_oink",
              "roboplan_rrt",
              "roboplan_simple_ik",
              "roboplan_toppra",
              "roboplan_cartesian_planning",
          ]
          versions = {
              package: tomllib.loads((Path(package) / "pyproject.toml").read_text())["project"]["version"]
              for package in packages
          }
          if len(set(versions.values())) != 1:
              raise SystemExit(f"Package versions differ: {versions}")
          print(f"version={next(iter(versions.values()))}")
          PY
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $RELEASE_TAG must use N.N.N format"
            exit 1
          fi
          if [ "$RELEASE_TAG" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package version $PACKAGE_VERSION"
            exit 1
          fi

  build_pure_wheels:
    name: Build pure Python wheels
    runs-on: ubuntu-latest
    needs: check_version
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build pure wheels
        run: |
          python -m pip install --upgrade build twine
          mkdir wheelhouse
          python -m build --wheel --outdir wheelhouse roboplan_common
          python -m build --wheel --outdir wheelhouse roboplan
          python -m twine check wheelhouse/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions-pure
          path: wheelhouse/*.whl
          if-no-files-found: error

  build_wheels:
    name: Build ${{ matrix.name }} wheels
    runs-on: ${{ matrix.os }}
    needs: build_pure_wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            archs: x86_64
            artifact: linux-x86_64
            extra_environment: ""
          - name: Linux aarch64
            os: ubuntu-24.04-arm
            archs: aarch64
            artifact: linux-aarch64
            extra_environment: ""
          - name: macOS arm64
            os: macos-14
            archs: arm64
            artifact: macos-arm64
            extra_environment: "MACOSX_DEPLOYMENT_TARGET=14.0"
    env:
      CIBW_ARCHS: ${{ matrix.archs }}
      CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
      CIBW_SKIP: "pp* *-musllinux*"
      CIBW_REPAIR_WHEEL_COMMAND: ""
      CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
      CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
      CIBW_ENVIRONMENT: >-
        CMEEL_JOBS=2
        CMAKE_BUILD_PARALLEL_LEVEL=2
        MAKEFLAGS="-j2"
        NINJAFLAGS="-j2"
        ${{ matrix.extra_environment }}
      CIBW_BEFORE_BUILD_LINUX: pip config set global.find-links /host${{ github.workspace }}/wheelhouse
      CIBW_BEFORE_BUILD_MACOS: pip config set global.find-links ${{ github.workspace }}/wheelhouse
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: python-distributions-pure
          path: wheelhouse
      - name: Build roboplan-core wheels
        uses: pypa/cibuildwheel@v4.1.0
        with:
          package-dir: roboplan_core
          output-dir: wheelhouse

      - name: Build roboplan-example-models wheels
        uses: pypa/cibuildwheel@v4.1.0
        with:
          package-dir: roboplan_example_models
          output-dir: wheelhouse
      - name: Build roboplan-oink wheels
        uses: pypa/cibuildwheel@v4.1.0
        with:
          package-dir: roboplan_oink
          output-dir: wheelhouse
      - name: Build roboplan-rrt wheels
        uses: pypa/cibuildwheel@v4.1.0
        with:
          package-dir: roboplan_rrt
          output-dir: wheelhouse
      - name: Build roboplan-simple-ik wheels
        uses: pypa/cibuildwheel@v4.1.0
        with:
          package-dir: roboplan_simple_ik
          output-dir: wheelhouse
      - name: Build roboplan-toppra wheels
        uses: pypa/cibuildwheel@v4.1.0
        with:
          package-dir: roboplan_toppra
          output-dir: wheelhouse
      - name: Build and test roboplan-cartesian-planning wheels
        uses: pypa/cibuildwheel@v4.1.0
        with:
          package-dir: roboplan_cartesian_planning
          output-dir: wheelhouse
        env:
          CIBW_BEFORE_TEST_LINUX: >-
            pip install --find-links /host${{ github.workspace }}/wheelhouse
            roboplan roboplan-example-models roboplan-rrt roboplan-simple-ik
          CIBW_BEFORE_TEST_MACOS: >-
            pip install --find-links ${{ github.workspace }}/wheelhouse
            roboplan roboplan-example-models roboplan-rrt roboplan-simple-ik
          CIBW_TEST_COMMAND: >-
            python -c "import roboplan.core; import roboplan.filters; import roboplan.example_models;
            import roboplan.simple_ik; import roboplan.optimal_ik; import roboplan.rrt;
            import roboplan.toppra; import roboplan.cartesian_planning; print('roboplan imports ok')"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions-${{ matrix.artifact }}
          path: |
            wheelhouse/roboplan_core-*.whl
            wheelhouse/roboplan_example_models-*.whl
            wheelhouse/roboplan_oink-*.whl
            wheelhouse/roboplan_rrt-*.whl
            wheelhouse/roboplan_simple_ik-*.whl
            wheelhouse/roboplan_toppra-*.whl
            wheelhouse/roboplan_cartesian_planning-*.whl
          if-no-files-found: error

  build_sdist:
    name: Build source distributions
    runs-on: ubuntu-latest
    needs: [build_pure_wheels, build_wheels]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v5
        with:
          pattern: python-distributions-*
          merge-multiple: true
          path: wheelhouse
      - name: Build source distributions
        run: |
          python -m pip install --upgrade build twine
          mkdir -p "$HOME/.config/pip" dist
          printf '[global]\nfind-links = %s/wheelhouse\n' "$PWD" > "$HOME/.config/pip/pip.conf"
          for package in roboplan_common roboplan_core roboplan_example_models roboplan_oink roboplan_rrt roboplan_simple_ik roboplan_toppra roboplan_cartesian_planning roboplan; do
            python -m build --sdist --outdir dist "$package"
          done
          python -m twine check dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
