name: "Pixi ROS Build and Test"

on:
  workflow_call: {}

jobs:
  pixi_ros_build_and_test:
    name: ${{ matrix.os }} - Build, test (${{ matrix.ros_distro }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # TEMP: narrowed to one macOS combo to debug why colcon's isolated
        # install resolves cross-package dylibs on GH runners but not
        # locally, even with DYLD_LIBRARY_PATH stripped. Revert before merge.
        os: [macos-latest]
        ros_distro: [kilted]

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # On Windows, this ensures bash stops at the first failing command.
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: .sccache
          key: ${{ runner.os }}-${{ matrix.ros_distro }}-sccache-${{ github.head_ref || github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.ros_distro }}-sccache-main
            ${{ runner.os }}-${{ matrix.ros_distro }}-sccache
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          environments: ${{ matrix.ros_distro }}
      - name: Build and test
        env:
          SCCACHE_DIR: ${{ github.workspace }}/.sccache
        run: |
          pixi run -e ${{ matrix.ros_distro }} setup
          pixi run -e ${{ matrix.ros_distro }} build
          pixi run -e ${{ matrix.ros_distro }} test
          pixi run -e ${{ matrix.ros_distro }} test-result
      # TEMP: debug step for the macOS colcon dylib investigation. Remove
      # once we've confirmed why this runner resolves @rpath deps that a
      # local build with DYLD_LIBRARY_PATH stripped can't.
      - name: Debug macOS dylib resolution
        if: runner.os == 'macOS'
        run: |
          set -x
          sw_vers
          uname -a
          csrutil status || true
          xcodebuild -version || true
          EXT=$(find install -name '_cartesian_ext*.so')
          LIB=$(find install -name 'libroboplan_cartesian_planning.dylib')
          echo "=== otool -l (LC_RPATH) for $EXT ==="
          otool -l "$EXT" | grep -A2 LC_RPATH
          echo "=== otool -L for $EXT ==="
          otool -L "$EXT"
          echo "=== otool -l (LC_RPATH) for $LIB ==="
          otool -l "$LIB" | grep -A2 LC_RPATH
          echo "=== otool -L for $LIB ==="
          otool -L "$LIB"
          echo "=== import with DYLD_LIBRARY_PATH stripped, dyld tracing on ==="
          pixi run -e ${{ matrix.ros_distro }} bash -c '
            source install/setup.bash
            env -u DYLD_LIBRARY_PATH DYLD_PRINT_LIBRARIES=1 DYLD_PRINT_RPATHS=1 \
              python3 -c "import roboplan.cartesian_planning; print(\"IMPORT OK\")" 2>&1
          '
